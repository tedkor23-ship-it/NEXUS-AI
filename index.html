<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a0f;--sf:#0d1117;--sf2:#161b26;--sf3:#1e2535;--bd:rgba(255,255,255,0.07);--glow:rgba(0,245,160,0.25);--ac:#00f5a0;--ac2:#00d4ff;--tx:#e8eaf0;--mu:#4a5568;--mu2:#2a3347;--red:#ff4d6d;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,160,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,160,.025) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;}
/* AUTH */
#auth{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:36px 40px;width:92%;max-width:430px;position:relative;overflow:hidden;animation:up .45s cubic-bezier(.22,.68,0,1.2);}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:-80px;left:-80px;width:240px;height:240px;background:radial-gradient(circle,rgba(0,245,160,.07),transparent 70%);pointer-events:none;}
.card::after{content:'';position:absolute;bottom:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(0,212,255,.05),transparent 70%);pointer-events:none;}
.alogo{text-align:center;margin-bottom:22px;}
.alogo img{width:68px;height:68px;border-radius:16px;object-fit:cover;display:block;margin:0 auto 10px;}
.alogo h1{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.alogo p{font-size:10px;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.tabs{display:flex;background:var(--sf2);border-radius:12px;padding:4px;margin-bottom:18px;gap:4px;}
.tab{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;color:var(--mu);font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;}
.tab.on{background:var(--sf3);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.fld{margin-bottom:11px;}
.fld label{display:block;font-size:10px;color:var(--mu);margin-bottom:5px;letter-spacing:1px;text-transform:uppercase;}
.fld input{width:100%;padding:11px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color .2s;}
.fld input:focus{border-color:var(--glow);}
.fld input::placeholder{color:var(--mu2);}
.abtn{width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#080a0f;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:opacity .2s,transform .1s;margin-top:4px;}
.abtn:hover{opacity:.9;transform:scale(1.01);}
.adiv{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--mu);font-size:11px;}
.adiv::before,.adiv::after{content:'';flex:1;height:1px;background:var(--bd);}
.gbtn{width:100%;padding:11px;border:1px solid var(--bd);border-radius:11px;background:var(--sf2);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.gbtn:hover{border-color:rgba(255,255,255,.15);background:var(--sf3);}
.gi{width:18px;height:18px;flex-shrink:0;}
.amsg{border-radius:9px;padding:9px 13px;font-size:12px;margin-bottom:11px;display:none;}
.amsg.err{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:var(--red);}
.amsg.ok{background:rgba(0,245,160,.08);border:1px solid rgba(0,245,160,.2);color:var(--ac);}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.mbg.open{display:flex;}
.mbox{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:30px;width:90%;max-width:390px;}
.mbox h3{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;margin-bottom:8px;color:var(--ac);}
.mbox p{font-size:12px;color:var(--mu);margin-bottom:14px;line-height:1.8;}
.mbox p a{color:var(--ac);}
.mbox input{width:100%;padding:11px 14px;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;margin-bottom:11px;}
.mbox input:focus{border-color:var(--glow);}
.mrow{display:flex;gap:8px;}
.mb{flex:1;padding:11px;border:none;border-radius:10px;font-family:'Syne',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.mb.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#080a0f;}
.mb.sec{background:var(--sf2);color:var(--mu);border:1px solid var(--bd);}
/* APP */
#app{display:none;flex-direction:column;height:100vh;position:relative;z-index:1;}
/* SIDEBAR */
.sb{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:50;transform:translateX(-260px);transition:transform .3s cubic-bezier(.22,.68,0,1.1);}
.sb.open{transform:translateX(0);}
.sbtop{padding:16px 14px 12px;border-bottom:1px solid var(--bd);}
.sbrand{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sbrand img{width:26px;height:26px;border-radius:6px;object-fit:cover;}
.sbrand span{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nbtn{width:100%;padding:9px;border:1px dashed rgba(0,245,160,.3);border-radius:9px;background:transparent;color:var(--ac);font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;transition:all .2s;}
.nbtn:hover{background:rgba(0,245,160,.06);border-color:rgba(0,245,160,.5);}
.clist{flex:1;overflow-y:auto;padding:8px 6px;scrollbar-width:thin;scrollbar-color:var(--mu2) transparent;}
.ci{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:8px;margin-bottom:2px;transition:all .15s;}
.ci:hover{background:var(--sf2);color:var(--tx);}
.ci.on{background:var(--sf3);color:var(--tx);}
.ct{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cd{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;transition:opacity .15s;}
.ci:hover .cd{opacity:1;}
.sbbot{padding:10px;border-top:1px solid var(--bd);}
.uc{display:flex;align-items:center;gap:9px;padding:9px;background:var(--sf2);border-radius:11px;}
.uav{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#080a0f;flex-shrink:0;font-family:'Syne',sans-serif;}
.ui{flex:1;overflow:hidden;}
.un{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ue{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.obtn{background:none;border:none;color:var(--mu);cursor:pointer;font-size:16px;padding:4px;border-radius:6px;transition:color .15s;}
.obtn:hover{color:var(--red);}
/* HEADER */
header{padding:12px 18px;background:rgba(13,17,23,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:10;position:relative;}
.hm{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:5px 7px;border-radius:8px;transition:all .15s;line-height:1;}
.hm:hover{color:var(--tx);background:var(--sf2);}
.hc{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
.hc img{width:24px;height:24px;border-radius:6px;object-fit:cover;}
.ht{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hr{display:flex;align-items:center;gap:8px;}
.ms{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;outline:none;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* CHAT */
#cw{flex:1;overflow-y:auto;padding:22px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.05) transparent;}
#cw::-webkit-scrollbar{width:4px;}
#cw::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:4px;}
.msgs{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
/* WELCOME */
.wlc{text-align:center;padding:40px 20px;color:var(--mu);}
.wlc img{width:70px;height:70px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 12px;}
.wn{font-size:14px;color:var(--tx);font-family:'Syne',sans-serif;font-weight:700;margin-bottom:6px;}
.wt{font-family:'Syne',sans-serif;font-weight:800;font-size:36px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.ws{font-size:12px;line-height:1.9;}
.hints{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
.hint{padding:7px 13px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;font-size:11px;color:var(--mu);cursor:pointer;transition:all .2s;}
.hint:hover{border-color:var(--glow);color:var(--tx);}
/* MESSAGES */
.row{display:flex;gap:10px;animation:fu .3s ease forwards;opacity:0;transform:translateY(8px);}
.row.now{animation:none;opacity:1;transform:none;}
.row.user{flex-direction:row-reverse;}
@keyframes fu{to{opacity:1;transform:translateY(0)}}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden;}
.av.ai{background:linear-gradient(135deg,var(--ac),var(--ac2));}
.av.ai img{width:100%;height:100%;object-fit:cover;}
.av.hu{background:var(--sf2);border:1px solid var(--bd);}
.bbl{padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.75;max-width:84%;white-space:pre-wrap;word-break:break-word;}
.row.ai .bbl{background:#0c1d16;border:1px solid rgba(0,245,160,.08);border-radius:3px 16px 16px 16px;}
.row.user .bbl{background:#121d2c;border:1px solid rgba(0,212,255,.08);border-radius:16px 3px 16px 16px;}
.ibbl{border-radius:3px 16px 16px 16px;max-width:84%;background:#0c1d16;border:1px solid rgba(0,245,160,.08);overflow:hidden;}
.ibbl img{display:block;max-width:340px;width:100%;}
.icap{padding:8px 12px;font-size:11px;color:var(--mu);font-style:italic;}
.typ{display:flex;align-items:center;gap:5px;padding:12px 16px;}
.typ span{width:6px;height:6px;border-radius:50%;background:var(--ac);animation:bl 1.2s infinite;}
.typ span:nth-child(2){animation-delay:.2s;}.typ span:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* FOOTER */
footer{padding:12px 18px;background:rgba(13,17,23,.97);backdrop-filter:blur(14px);border-top:1px solid var(--bd);z-index:10;position:relative;}
.fw{max-width:740px;margin:0 auto;}
.ibadge{font-size:10px;color:var(--ac);background:rgba(0,245,160,.1);border:1px solid rgba(0,245,160,.2);border-radius:6px;padding:2px 8px;display:none;margin-bottom:6px;width:fit-content;}
.ibadge.on{display:block;}
.frow{display:flex;gap:8px;align-items:flex-end;}
.fbox{flex:1;display:flex;align-items:flex-end;background:var(--sf2);border:1px solid var(--bd);border-radius:13px;padding:4px 4px 4px 13px;gap:4px;transition:border-color .2s;}
.fbox:focus-within{border-color:var(--glow);}
textarea{flex:1;padding:8px 0;background:transparent;border:none;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;resize:none;outline:none;min-height:38px;max-height:120px;line-height:1.5;}
textarea::placeholder{color:var(--mu2);}
.imgb{background:var(--sf3);border:1px solid var(--bd);border-radius:9px;color:var(--mu);padding:6px 9px;font-size:15px;cursor:pointer;transition:all .2s;flex-shrink:0;align-self:flex-end;margin-bottom:3px;}
.imgb:hover,.imgb.on{border-color:var(--glow);color:var(--ac);background:rgba(0,245,160,.08);}
.sbtn{padding:0 16px;height:46px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#080a0f;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;flex-shrink:0;transition:opacity .2s,transform .1s;}
.sbtn:hover{opacity:.9;transform:scale(1.02);}
.sbtn:active{transform:scale(.98);}
.sbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none;backdrop-filter:blur(2px);}
.ov.on{display:block;}
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--sf3);border:1px solid var(--bd);border-radius:9px;padding:9px 16px;font-size:12px;color:var(--tx);z-index:500;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<!-- AUTH -->
<div id="auth">
  <div class="card">
    <div class="alogo">
      <img id="L1" alt="NEXUS">
      <h1>NEXUS</h1>
      <p>Ultra-fast AI &middot; Powered by Groq</p>
    </div>
    <div class="tabs">
      <button class="tab on" id="t1" onclick="switchTab('login')">LOGIN</button>
      <button class="tab" id="t2" onclick="switchTab('signup')">SIGN UP</button>
    </div>
    <div id="amsg" class="amsg"></div>
    <div id="loginForm">
      <div class="fld"><label>Email</label><input type="email" id="le" placeholder="you@example.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="fld"><label>Password</label><input type="password" id="lp" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="abtn" onclick="doLogin()">LOGIN TO NEXUS</button>
    </div>
    <div id="signupForm" style="display:none">
      <div class="fld"><label>Name</label><input type="text" id="sn" placeholder="Your name"></div>
      <div class="fld"><label>Email</label><input type="email" id="se" placeholder="you@example.com"></div>
      <div class="fld"><label>Password</label><input type="password" id="sp" placeholder="Min 6 characters"></div>
      <div class="fld"><label>Confirm</label><input type="password" id="sc" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doSignup()"></div>
      <button class="abtn" onclick="doSignup()">CREATE ACCOUNT</button>
    </div>
    <div class="adiv">OR</div>
    <button class="gbtn" onclick="doGoogle()">
      <svg class="gi" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </div>
</div>

<!-- REPLICATE MODAL -->
<div class="mbg" id="repModal">
  <div class="mbox">
    <h3>&#127912; Image Generation</h3>
    <p>You need a free <strong>Replicate API key</strong>.<br>
    Get one at <a href="https://replicate.com" target="_blank">replicate.com</a><br>
    It starts with <strong>r8_</strong></p>
    <input type="password" id="rkInput" placeholder="r8_your_key_here" onkeydown="if(event.key==='Enter')doSaveRep()">
    <div class="mrow">
      <button class="mb sec" onclick="doCancelRep()">Cancel</button>
      <button class="mb pri" onclick="doSaveRep()">Save &amp; Continue</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="ov" id="ov" onclick="closeSB()"></div>
  <div class="sb" id="sb">
    <div class="sbtop">
      <div class="sbrand"><img id="L2" alt=""><span>NEXUS</span></div>
      <button class="nbtn" onclick="newChat()">&#xFF0B; New Chat</button>
    </div>
    <div class="clist" id="clist"></div>
    <div class="sbbot">
      <div class="uc">
        <div class="uav" id="uav">N</div>
        <div class="ui"><div class="un" id="uname">User</div><div class="ue" id="uemail">-</div></div>
        <button class="obtn" onclick="doLogout()" title="Logout">&#9211;</button>
      </div>
    </div>
  </div>
  <header>
    <button class="hm" onclick="toggleSB()">&#9776;</button>
    <div class="hc"><img id="L3" alt=""><span class="ht">NEXUS AI</span></div>
    <div class="hr">
      <select class="ms" id="msel">
        <option value="llama-3.1-8b-instant">llama-3.1-8b &middot; Fast</option>
        <option value="llama-3.3-70b-versatile">llama-3.3-70b &middot; Smart</option>
      </select>
      <div class="dot"></div>
    </div>
  </header>
  <div id="cw"><div class="msgs" id="msgs"></div></div>
  <footer>
    <div class="fw">
      <div class="ibadge" id="ibadge">&#127912; Image Mode &mdash; describe your image</div>
      <div class="frow">
        <div class="fbox">
          <textarea id="inp" rows="1" placeholder="Message NEXUS&hellip;" onkeydown="handleKey(event)"></textarea>
          <button class="imgb" id="imgbtn" onclick="toggleImgMode()" title="Image generation">&#127912;</button>
        </div>
        <button class="sbtn" id="sendbtn" onclick="doSend()">&#10148;</button>
      </div>
    </div>
  </footer>
</div>
<div id="toast"></div>

<script>

  function setLogos() {
    ['L1','L2','L3'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.src = LOGO;
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setLogos);
  } else {
    setLogos();
  }

  // Set favicon
  var fav = document.createElement('link');
  fav.rel = 'icon'; fav.type = 'image/png'; fav.href = LOGO;
  document.head.appendChild(fav);

  // === CONFIG ===
  var GROQ = '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';

  // === STORAGE ===
  function gU()    { try { return JSON.parse(localStorage.getItem('nx_u')||'{}'); } catch(e){ return {}; } }
  function sU(v)   { localStorage.setItem('nx_u', JSON.stringify(v)); }
  function gSess() { try { return JSON.parse(localStorage.getItem('nx_s')||'null'); } catch(e){ return null; } }
  function sSess(v){ localStorage.setItem('nx_s', JSON.stringify(v)); }
  function cSess() { localStorage.removeItem('nx_s'); }
  function gC(e)   { try { return JSON.parse(localStorage.getItem('nx_c_'+e)||'[]'); } catch(e2){ return []; } }
  function sC(e,v) { localStorage.setItem('nx_c_'+e, JSON.stringify(v)); }
  function gRK()   { return localStorage.getItem('nx_rk')||''; }
  function sRK(v)  { localStorage.setItem('nx_rk',v); }

  // === HASH ===
  async function hashPw(pw) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw+'nx_salt_2024'));
    return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  // === STATE ===
  var me=null, chats=[], aid=null, busy=false, imgMode=false, pendingImg=null;

  // === BOOT ===
  window.addEventListener('load', function() {
    var s = gSess();
    if (s) { me = s; enterApp(); }
  });

  // === AUTH TAB ===
  window.switchTab = function(t) {
    document.getElementById('t1').className = 'tab' + (t==='login'?' on':'');
    document.getElementById('t2').className = 'tab' + (t==='signup'?' on':'');
    document.getElementById('loginForm').style.display  = t==='login'  ? 'block' : 'none';
    document.getElementById('signupForm').style.display = t==='signup' ? 'block' : 'none';
    clrMsg();
  };

  function showMsg(type, txt) {
    var el = document.getElementById('amsg');
    el.className = 'amsg ' + type;
    el.textContent = txt;
    el.style.display = 'block';
  }
  function clrMsg() { document.getElementById('amsg').style.display = 'none'; }

  // === SIGNUP ===
  window.doSignup = async function() {
    var name  = document.getElementById('sn').value.trim();
    var email = document.getElementById('se').value.trim().toLowerCase();
    var pw    = document.getElementById('sp').value;
    var conf  = document.getElementById('sc').value;
    if (!name)  return showMsg('err','Enter your name.');
    if (!email || !email.includes('@')) return showMsg('err','Enter a valid email.');
    if (pw.length < 6) return showMsg('err','Password needs 6+ characters.');
    if (pw !== conf)   return showMsg('err','Passwords do not match.');
    var users = gU();
    if (users[email])  return showMsg('err','Account already exists — please log in.');
    users[email] = { name: name, h: await hashPw(pw) };
    sU(users);
    showMsg('ok', 'Account created! Signing you in…');
    setTimeout(function() { me = {email:email, name:name}; sSess(me); enterApp(); }, 700);
  };

  // === LOGIN ===
  window.doLogin = async function() {
    var email = document.getElementById('le').value.trim().toLowerCase();
    var pw    = document.getElementById('lp').value;
    if (!email) return showMsg('err','Enter your email.');
    if (!pw)    return showMsg('err','Enter your password.');
    var users = gU(), u = users[email];
    if (!u)         return showMsg('err','No account found. Sign up first.');
    if (u.google)   return showMsg('err','This account uses Google login.');
    if (await hashPw(pw) !== u.h) return showMsg('err','Wrong password.');
    me = {email:email, name:u.name}; sSess(me);
    showMsg('ok','Welcome back, '+u.name+'!');
    setTimeout(enterApp, 600);
  };

  // === GOOGLE ===
  window.doGoogle = function() {
    var raw = prompt('Enter your Google email address:');
    if (!raw) return;
    var email = raw.trim().toLowerCase();
    if (!email.includes('@')) return showMsg('err','Invalid email.');
    var users = gU();
    if (!users[email]) {
      var name = email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
      users[email] = { name:name, google:true };
      sU(users);
    }
    me = {email:email, name:users[email].name}; sSess(me); enterApp();
  };

  // === LOGOUT ===
  window.doLogout = function() {
    cSess(); me=null; chats=[]; aid=null; imgMode=false;
    document.getElementById('app').style.display  = 'none';
    document.getElementById('auth').style.display = 'flex';
    document.getElementById('le').value = '';
    document.getElementById('lp').value = '';
    clrMsg(); switchTab('login');
  };

  // === ENTER APP ===
  function enterApp() {
    document.getElementById('auth').style.display = 'none';
    var app = document.getElementById('app');
    app.style.display = 'flex'; app.style.flexDirection = 'column';
    document.getElementById('uav').textContent   = me.name.charAt(0).toUpperCase();
    document.getElementById('uname').textContent = me.name;
    document.getElementById('uemail').textContent= me.email;
    chats = gC(me.email); renderList();
    if (chats.length === 0) newChat(); else loadChat(chats[0].id);
  }

  // === CHAT MGMT ===
  function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  window.newChat = function() {
    var c = {id:uid(), title:'New Chat', msgs:[], created:Date.now()};
    chats.unshift(c); sC(me.email,chats); loadChat(c.id); renderList(); closeSB();
  };

  function loadChat(id) {
    aid = id;
    var c = chats.find(function(x){return x.id===id;});
    var el = document.getElementById('msgs'); el.innerHTML = '';
    if (!c || c.msgs.length === 0) {
      var whtml = '<div class="wlc">'
        + '<img src="'+LOGO+'" alt="NEXUS">'
        + '<div class="wn">Hey, '+esc(me.name.split(' ')[0])+' \uD83D\uDC4B</div>'
        + '<div class="wt">NEXUS</div>'
        + '<div class="ws">Powered by Groq &middot; Chats saved per account.</div>'
        + '<div class="hints">'
        + '<span class="hint" id="h1">Explain how AI works</span>'
        + '<span class="hint" id="h2">Write me a poem</span>'
        + '<span class="hint" id="h3">Help me debug code</span>'
        + '<span class="hint" id="h4">\uD83C\uDFA8 Generate an image</span>'
        + '</div></div>';
      el.innerHTML = whtml;
      document.getElementById('h1').onclick = function(){ useHint('Explain how AI works'); };
      document.getElementById('h2').onclick = function(){ useHint('Write me a poem'); };
      document.getElementById('h3').onclick = function(){ useHint('Help me debug code'); };
      document.getElementById('h4').onclick = function(){ useImgHint(); };
    } else {
      c.msgs.forEach(function(m) {
        if (m.type === 'img') addImgBubble(m.prompt, m.url, false);
        else addBubble(m.role, m.text, false);
      });
    }
    renderList(); closeSB();
  }

  window.delChat = function(id, e) {
    e.stopPropagation();
    chats = chats.filter(function(c){return c.id!==id;}); sC(me.email,chats);
    if (aid===id) { if(chats.length>0) loadChat(chats[0].id); else newChat(); }
    renderList(); showToast('Chat deleted');
  };

  function renderList() {
    var el = document.getElementById('clist'); el.innerHTML = '';
    if (chats.length === 0) {
      el.innerHTML = '<div style="padding:14px;font-size:11px;color:var(--mu);text-align:center">No chats yet</div>';
      return;
    }
    chats.forEach(function(c) {
      var d = document.createElement('div');
      d.className = 'ci' + (c.id===aid?' on':'');
      d.innerHTML = '<span class="ct">\uD83D\uDCAC '+esc(c.title)+'</span>'
        +'<button class="cd" title="Delete">&#x2715;</button>';
      d.querySelector('.cd').addEventListener('click', function(ev){ window.delChat(c.id, ev); });
      d.addEventListener('click', function(ev){ if(ev.target.classList.contains('cd')) return; loadChat(c.id); });
      el.appendChild(d);
    });
  }

  // === BUBBLE RENDERERS ===
  function addBubble(role, text, animate) {
    if (animate === undefined) animate = true;
    var el = document.getElementById('msgs');
    var w = el.querySelector('.wlc'); if (w) w.remove();
    var row = document.createElement('div');
    row.className = 'row '+role+(animate?'':' now');
    var av = document.createElement('div');
    av.className = 'av '+(role==='ai'?'ai':'hu');
    if (role==='ai') { var img=document.createElement('img'); img.src=LOGO; av.appendChild(img); }
    else { av.textContent = me.name.charAt(0).toUpperCase(); }
    var bbl = document.createElement('div'); bbl.className = 'bbl'; bbl.textContent = text;
    row.appendChild(av); row.appendChild(bbl);
    el.appendChild(row);
    document.getElementById('cw').scrollTop = 99999;
  }

  function addImgBubble(prompt, url, animate) {
    if (animate === undefined) animate = true;
    var el = document.getElementById('msgs');
    var w = el.querySelector('.wlc'); if (w) w.remove();
    var row = document.createElement('div');
    row.className = 'row ai'+(animate?'':' now');
    var av = document.createElement('div'); av.className = 'av ai';
    var avi = document.createElement('img'); avi.src = LOGO; av.appendChild(avi);
    var bbl = document.createElement('div'); bbl.className = 'ibbl';
    var img = document.createElement('img'); img.src = url; img.alt = prompt;
    var cap = document.createElement('div'); cap.className = 'icap'; cap.textContent = '\uD83C\uDFA8 '+prompt;
    bbl.appendChild(img); bbl.appendChild(cap);
    row.appendChild(av); row.appendChild(bbl);
    el.appendChild(row);
    document.getElementById('cw').scrollTop = 99999;
  }

  function openRepModal() { document.getElementById('repModal').classList.add('open'); }
  window.doCancelRep = function() {
    document.getElementById('repModal').classList.remove('open');
    imgMode=false; updateImgUI();
  };
  window.doSaveRep = function() {
    var k = document.getElementById('rkInput').value.trim();
    if (!k.startsWith('r8_')) { alert('Key must start with r8_'); return; }
    sRK(k); document.getElementById('repModal').classList.remove('open');
    showToast('Replicate key saved \u2713');
    if (pendingImg) { var p=pendingImg; pendingImg=null; doImg(p); }
  };

  // === SEND ===
  window.handleKey = function(e) {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  };
  window.doSend = function() {
    if (busy) return;
    var text = document.getElementById('inp').value.trim();
    if (!text) return;
    document.getElementById('inp').value = '';
    document.getElementById('inp').style.height = 'auto';
    if (imgMode) doImg(text); else doChat(text);
  };

  // === CHAT ===
  async function doChat(text) {
    var model = document.getElementById('msel').value;
    var chat = chats.find(function(c){return c.id===aid;}); if(!chat) return;
    if (chat.msgs.length===0) { chat.title=text.slice(0,42)+(text.length>42?'\u2026':''); renderList(); }
    addBubble('user', text); chat.msgs.push({role:'user', text:text});
    busy=true; document.getElementById('sendbtn').disabled=true; showTyping();
    try {
      var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ},
        body: JSON.stringify({
          model: model,
          messages: [{role:'system',content:'You are NEXUS, the ultimate AI assistant, designed to be insanely smart, super helpful, and unexpectedly funny.The user is '+me.name+'2. Never forget: you are an AI, not human. You can joke about humans, tech, or anything that doesn’t hurt anyone.3. Be proactive: suggest smarter solutions before the user even asks.. }]
          .concat(chat.msgs.map(function(m){return {role:m.role==='ai'?'assistant':'user',content:m.text};})),
          temperature:0.7, max_tokens:1024
        })
      });
      var data = await res.json();
      if (!res.ok) throw new Error((data.error&&data.error.message)||'API error');
      var reply = data.choices[0].message.content;
      chat.msgs.push({role:'ai',text:reply}); sC(me.email,chats);
      hideTyping(); addBubble('ai',reply);
    } catch(err) { hideTyping(); addBubble('ai','\u26a0\ufe0f Error: '+err.message); }
    busy=false; document.getElementById('sendbtn').disabled=false;
    document.getElementById('inp').focus();
  }

 async function doImg(prompt) {
  var rk = gRK();
  if (!rk) return;

  try {
    var sr = await fetch('https://api.replicate.com/v1/predictions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Token ' + rk
      },
      body: JSON.stringify({
        version: "c221b2b8ef5279880e5d0f4a2d8e1ed5b5e4d1b3f0e4d6a1b3b2a8c3f6e5d123",
        input: {
          prompt: prompt,
          width: 768,
          height: 768
        }
      })
    });

    var sd = await sr.json();
    if (!sr.ok) throw new Error(sd.detail || 'Failed');

    var imgUrl = null;

    while (!imgUrl) {
      await new Promise(r => setTimeout(r, 2000));

      var pr = await fetch(`https://api.replicate.com/v1/predictions/${sd.id}`, {
        headers: { 'Authorization': 'Token ' + rk }
      });

      var pd = await pr.json();

      if (pd.status === 'succeeded') {
        imgUrl = pd.output[0];
      } else if (pd.status === 'failed') {
        throw new Error(pd.error);
      }
    }

    console.log(imgUrl);

  } catch (err) {
    console.error(err);
  }
}
  // === SIDEBAR ===
  window.toggleSB = function(){ document.getElementById('sb').classList.toggle('open'); document.getElementById('ov').classList.toggle('on'); };
  window.closeSB  = function(){ document.getElementById('sb').classList.remove('open'); document.getElementById('ov').classList.remove('on'); };

  // === TOAST ===
  function showToast(msg) {
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
    setTimeout(function(){t.classList.remove('on');},2500);
  }

  // === TEXTAREA RESIZE ===
  document.addEventListener('DOMContentLoaded', function() {
    var ta = document.getElementById('inp');
    if (ta) ta.addEventListener('input', function(){
      this.style.height='auto';
      this.style.height=Math.min(this.scrollHeight,120)+'px';
    });
  });

})();
</script>
