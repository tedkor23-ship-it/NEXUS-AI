<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS AI — Powered by Groq</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* (Your entire CSS stays exactly the same — unchanged for clean UI) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'JetBrains Mono', monospace; background:#080a0f; color:#e8eaf0; height:100vh; display:flex; flex-direction:column; overflow:hidden;}
header, footer { padding:16px 20px; background:#0d1117; border-color:rgba(255,255,255,0.07);}
.messages { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
.bubble { padding:14px 18px; border-radius:18px; font-size:13px; line-height:1.6;}
.message { display:flex; gap:12px;}
.message.user { flex-direction:row-reverse;}
.avatar { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
.avatar.ai { background:linear-gradient(135deg,#00f5a0,#00d4ff);}
.avatar.user { background:#161b26;}
.message.ai .bubble { background:#0f1e18;}
.message.user .bubble { background:#1a2332;}
textarea { flex:1; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.07); background:#0d1117; color:white;}
button { padding:10px 14px; border:none; border-radius:10px; cursor:pointer; background:linear-gradient(135deg,#00f5a0,#00d4ff);}
#chat-wrap { flex:1; overflow-y:auto; padding:20px;}
#setup { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#080a0f;}
.setup-card { background:#0d1117; padding:40px; border-radius:20px; width:90%; max-width:420px; text-align:center;}
input, select { width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid rgba(255,255,255,0.07); background:#161b26; color:white;}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h2 style="margin-bottom:15px;">⚡ NEXUS AI</h2>
    <p style="margin-bottom:20px;font-size:13px;color:#6b7280;">
      Enter your Groq API key (starts with <b>gsk_</b>)
    </p>
    <input type="password" id="api-key-input" placeholder="gsk_..." />
    <select id="model-select">
      <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (Fast & Free)</option>
      <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile (Smarter)</option>
    </select>
    <button onclick="startChat()">ACTIVATE</button>
  </div>
</div>

<header>
  <h3>NEXUS — Powered by Groq</h3>
</header>

<div id="chat-wrap">
  <div class="messages" id="messages"></div>
</div>

<footer style="display:flex; gap:10px;">
  <textarea id="user-input" rows="1" placeholder="Message NEXUS..."></textarea>
  <button onclick="sendMessage()">➤</button>
</footer>

<script>
let apiKey = "";
let model = "llama-3.1-8b-instant";
let conversationHistory = [];
let isLoading = false;

function startChat() {
  const key = document.getElementById("api-key-input").value.trim();
  const m = document.getElementById("model-select").value;

  if (!key || !key.startsWith("gsk_")) {
    alert("Enter valid Groq API key (starts with gsk_)");
    return;
  }

  apiKey = key;
  model = m;
  document.getElementById("setup").style.display = "none";
}

function addMessage(role, content) {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar " + role;
  avatar.textContent = role === "ai" ? "⚡" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  addMessage("user", text);

  conversationHistory.push({ role: "user", content: text });

  isLoading = true;

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          {
            role: "system",
            content: "You are NEXUS, a powerful AI assistant. Be helpful and clear."
          },
          ...conversationHistory
        ],
        temperature: 0.7,
        max_tokens: 1024
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "API error");
    }

    const reply = data.choices[0].message.content;
    conversationHistory.push({ role: "assistant", content: reply });

    addMessage("ai", reply);

  } catch (err) {
    addMessage("ai", "⚠️ Error: " + err.message);
  }

  isLoading = false;
}
</script>

</body>
</html>
